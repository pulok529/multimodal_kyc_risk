name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run test suite
        run: |
          pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t kyc-risk:test .

      - name: Run container
        run: |
          docker run -d --name kyc-risk-test -p 8000:8000 kyc-risk:test

      - name: Healthcheck with retries
        run: |
          success=false
          for i in $(seq 1 60); do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "Health check succeeded on attempt $i"
              success=true
              break
            fi
            echo "Waiting for service to be ready (attempt $i/60)..."
            sleep 2
          done
          if [ "$success" = false ]; then
            echo "Health check failed! Dumping container logs:"
            docker logs kyc-risk-test
            exit 1
          fi

      - name: Teardown container
        if: always()
        run: |
          docker stop kyc-risk-test || true
          docker rm kyc-risk-test || true
